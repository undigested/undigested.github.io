<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>undigested</title>
        <style>
            @import "https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap";

            :root {
                font-family: "Newsreader", "Libre Baskerville", serif;
                font-size: 16pt;

                --bg: #fafafa;
                --fg: #040404;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #040404;
                    --fg: #fafafa;
                }
            }

            @media print {
                :root {
                    --bg: #fff;
                    --fg: #000;
                }
            }

            
            body {
                box-sizing: border-box;
                width: 100vw;
                height: 100vh;

                padding: 0 10vw;
                margin: 0;

                background-color: var(--bg);
                color: var(--fg);

                display: flex;
                flex-direction: column;
            }
            
            main {
                box-sizing: border-box;
                width: 100%;
                height: 100%;
                padding: 5vh 5vw;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;

                gap: 0em;
            }


            footer {
                box-sizing: border-box;
                width: 100%;
                
                border-top: 1px var(--fg) solid;
                padding: 5vh 5vw;
                
                align-self: flex-end;
                text-align: right;
            }

            #title {
                position: relative;
                font-size: 2.5em;
                font-style: italic;
                font-weight: 400;
                letter-spacing: 0.02em;

                text-align: center;
                width: 100%;
            }

            a {
                color: inherit;
            }

            #titlecanon {
                text-wrap: balance;
            }

            #titlecanon.hide {
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                visibility: hidden;
            }

            #titlecontent {
                text-wrap: balance;
                position: relative;

                animation: title-fadein 6s forwards ease-out;
                text-wrap: nowrap;
                text-align: left;
            }

            #titlecontent div {
                display: block;
                position: relative;
            }

            @keyframes title-fadein {
                0% {
                    opacity: -0.5;
                    scale: 0.2;
                    translate: 0 50%;
                }

                100% {
                    opacity: 1;
                    scale: 1;
                    translate: 0 0;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1 id="title">
                <div id="titlecanon" class="hide"></div>
                <div id="titlecontent"></div>
                <noscript>something beautiful is going to happen.</noscript></span>
            </h1>

        </main>
        <footer>
            © 2026 <a href="/">undigested.org</a>
        </footer>
        <script>
            const lineBreaks = (textParent, parent) => {
                const text = textParent.firstChild;
                const range = document.createRange();
                range.setStart(text, 0);
                const x = textParent.getBoundingClientRect().x;

                let rects;
                let indices = [];
                for (let i = 0; i < text.textContent.length; i++) {
                    range.setEnd(text, i + 1);

                    rects = range.getClientRects();
                    if (rects.length > indices.length + 1) indices.push([i, rects[rects.length - 2].x - x]);
                }
                indices.push([text.textContent.length, rects[rects.length - 1].x - x]);
                return indices;
            };
        
            const string = "something beautiful is going to happen.";
            const alphabet = "abcdefghijklmnopqrstuvwxyz.";
            const shuffle = s => s.split("").sort(() => 0.5 - Math.random()).join("");
            const alphabets = string.split("").map(() => shuffle(alphabet));
            const indices = string.split("").map((s, i) => {
                const j = alphabets[i].indexOf(s);
                return j >= 0 ? j : s;
            });
            const interval = 40;
            const duration = 4000;
            const k = duration / interval;
            const divisor = k / Math.log(2 + string.length);
            window.onload = () => {
                const titleh = document.getElementById("titlecanon");
                const title = document.getElementById("titlecontent");
                titleh.innerHTML = string;
                let lines = lineBreaks(titleh);
                let it = -k / 2;
                const render = () => {
                    const t = 2 + string.length - Math.exp((k - it) / divisor);
                    const s = (t) => Math.floor(Math.exp(1.5 * (1 - t)));
                    const a = (j, i) => alphabets[j][i % alphabet.length];
                    let index = 0;
                    let text = "";
                    for (const [line, x] of lines) {
                        const lineText = indices.slice(index, line)
                            .map((i, j) => typeof i == "string" ? i : a((index + j), i + s(t - (index + j))))
                            .join("");
                        text += `<div style="left: ${x}px;">${lineText}</div>`;
                        index = line;
                    }
                    title.innerHTML = text;
                }

                
                const resize = new ResizeObserver(() => {
                    lines = lineBreaks(titleh);
                    render();
                });
                resize.observe(titleh);

                const f = () => {
                    if (title.getAnimations().every(anim => anim.playState === "finished")) {
                        title.innerHTML = "";
                        titleh.classList.remove("hide");
                        resize.unobserve(titleh);
                    } else {
                        setTimeout(f, interval);
                        it++;
                        render();
                    }
                };
                
                f();
            };
        </script>
    </body>
</html>
