<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>undigested</title>
        <style>
            @import "https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap";

            :root {
                font-family: "Newsreader", "Libre Baskerville", serif;
                font-size: 16pt;

                --bg: #fafafa;
                --fg: #040404;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #040404;
                    --fg: #fafafa;
                }
            }

            @media print {
                :root {
                    --bg: #fff;
                    --fg: #000;
                }
            }

            
            body {
                box-sizing: border-box;
                width: 100vw;
                height: 100vh;

                padding: 0 10vw;
                margin: 0;

                background-color: var(--bg);
                color: var(--fg);

                display: flex;
                flex-direction: column;
            }
            
            main {
                box-sizing: border-box;
                width: 100%;
                height: 100%;
                padding: 5vh 5vw;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;

                gap: 0em;
            }


            footer {
                box-sizing: border-box;
                width: 100%;
                
                border-top: 1px var(--fg) solid;
                padding: 5vh 5vw;
                
                align-self: flex-end;
                text-align: right;
            }

            h1 {
                font-size: 2.5em;
                font-style: italic;
                font-weight: 400;
                letter-spacing: 0.02em;

                text-align: left;
                text-wrap: balance;
                max-width: min(10em, 50vw);

                animation: title-fadein 6s forwards ease-out;
                scale: 0.2;
            }

            a {
                color: inherit;
            }

            @keyframes title-fadein {
                0% {
                    opacity: -0.5;
                    scale: 0.4;
                    translate: 0 50%;
                }

                100% {
                    opacity: 1;
                    scale: 1;
                    translate: 0 0;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>
                <span id="title"><noscript>something beautiful is going to happen.</noscript></span>
            </h1>

        </main>
        <footer>
            © 2026 <a href="/">undigested.org</a>
        </footer>
        <script>
            const string = "something beautiful is going to happen.";
            const alphabet = "abcdefghijklmnopqrstuvwxyz.";
            const shuffle = s => s.split("").sort(() => 0.5 - Math.random()).join("");
            const alphabets = string.split("").map(() => shuffle(alphabet));
            const indices = string.split("").map((s, i) => {
                const j = alphabets[i].indexOf(s);
                return j >= 0 ? j : s;
            });
            const interval = 40;
            const duration = 4000;
            const k = duration / interval;
            const divisor = k / Math.log(2 + string.length);
            window.onload = () => {
                const title = document.getElementById("title");
                let it = -k / 2;
                const f = () => {
                    const t = 2 + string.length - Math.exp((k - it++) / divisor);
                    const s = (t) => Math.floor(Math.exp(1.5 * (1 - t)));
                    const a = (j, i) => alphabets[j][i % alphabet.length];
                    title.innerHTML = indices.map((i, j) => typeof i == "string" ? i : a(j, i + s(t - j))).join("");
                    if (it < k) setTimeout(f, interval);
                }
                f();
            };
        </script>
    </body>
</html>
